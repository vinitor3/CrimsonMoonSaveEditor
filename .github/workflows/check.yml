name: Validate public source
on:
  push:
    branches:
      - main
      - 'legacy/**'
    paths:
      - 'crimson_editor.py'
      - 'crimson/**'
      - 'tests/**'
      - 'tools/**'
      - 'data/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'public-resources.json'
      - '.gitattributes'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'crimson_editor.py'
      - 'crimson/**'
      - 'tests/**'
      - 'tools/**'
      - 'data/**'
      - 'assets/**'
      - 'requirements*.txt'
      - 'public-resources.json'
      - '.gitattributes'
      - '.github/workflows/check.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python tools/bootstrap_public_assets.py
      - run: python tools/audit_public.py
      - run: python tools/run_tests.py
